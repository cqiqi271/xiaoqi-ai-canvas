<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目主页</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
      overflow: hidden;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }
    .frame {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at center, #222 0%, #111 60%, #0a0a0a 100%);
    }
    img {
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      display: block;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
      background: #000;
    }
  </style>
</head>
<body>
  <div class="frame">
    <img src="/static/images/wechat-qr.jpg" alt="项目主页图片">
  </div>
</body>
</html>
